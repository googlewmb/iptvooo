# Production rules:
# 1. Run operator-network collectors only on a network and account authorized for that service.
# 2. Keep account IDs, passwords, MAC/STB identifiers, tokens, and capture files out of public Git.
# 3. GitHub Actions should process/publish data uploaded by the local collector; it cannot sniff a home LAN or directly join private IPTV multicast networks.
# 4. Do not mark status=verified as proof of playback reachability; run regional connectivity and stream checks locally.
